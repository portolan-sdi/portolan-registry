# Basic CI - validates schema and catalog files
name: CI

on:
  push:
    branches: [main]
  pull_request:
    # No branch filter. A pull request aimed anywhere else still runs
    # these checks; without that, a stacked pull request shows green
    # having run none of them.
  workflow_dispatch:

jobs:
  validate-schema:
    name: Validate JSON Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install ajv-cli
        run: npm install -g ajv-cli ajv-formats

      - name: Validate schema is valid JSON Schema
        run: |
          ajv compile \
            --spec=draft2020 \
            -c ajv-formats \
            --all-errors \
            -s schema/entry.schema.json

      - name: Validate all catalog entries against schema
        run: |
          # Convert YAML to JSON and validate each
          npm install -g js-yaml
          for f in catalogs/*.yaml; do
            echo "Validating $f..."
            js-yaml "$f" > /tmp/entry.json
            ajv validate \
              --spec=draft2020 \
              -c ajv-formats \
              -s schema/entry.schema.json \
              -d /tmp/entry.json \
              --all-errors
          done

  json-lint:
    name: Lint JSON Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check JSON formatting
        run: |
          # Validate all JSON files are valid
          for f in $(find . -name '*.json' -not -path './.git/*'); do
            echo "Checking $f..."
            python3 -m json.tool "$f" > /dev/null
          done

  test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      # Discovery and import paths come from pyproject.toml, so this runs
      # from the repository root. Tests marked `network` are deselected.
      - name: Run tests
        run: uv run --frozen --group dev pytest -v

  exports-valid:
    name: Validate Exports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install ajv-cli
        run: npm install -g ajv-cli ajv-formats

      - name: Validate export against schema
        run: |
          if [ -f exports/catalogs.json ]; then
            python3 -m json.tool exports/catalogs.json > /dev/null
            ajv validate \
              --spec=draft2020 \
              -c ajv-formats \
              -s schema/export.schema.json \
              -d exports/catalogs.json \
              --all-errors
          else
            echo "No exports/catalogs.json found (will be created on first publish)"
          fi
