name: Validate Catalogs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'catalogs/*.yaml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Get changed catalogs
        id: changed
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'catalogs/*.yaml' > changed.txt
          echo "Changed catalog files:"
          cat changed.txt
          echo "count=$(wc -l < changed.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Validate changed catalogs
        if: steps.changed.outputs.count != '0'
        run: |
          uv run --with pyyaml --with requests --with email-validator python3 << 'PYTHON'
          import yaml
          import json
          import math
          import requests
          from pathlib import Path
          from datetime import datetime, timezone
          from urllib.parse import urlparse, urlunparse
          from email_validator import validate_email, EmailNotValidError

          def validate_maintainer_email(email, catalog_id):
              """Validate maintainer email - hard fail on syntax or deliverability issues."""
              if not email:
                  return None

              # Full validation: syntax + MX record check
              try:
                  v = validate_email(email, check_deliverability=True)
                  return v.normalized
              except EmailNotValidError as e:
                  raise ValueError(f"Invalid maintainer email: {email} - {e}")

          def extract_maintainer_email(providers):
              """Extract first maintainer email from providers list."""
              if not providers:
                  return None
              for provider in providers:
                  if isinstance(provider, dict):
                      contact = provider.get('contact') or {}
                      if isinstance(contact, dict) and contact.get('email'):
                          return contact['email']
              return None

          def normalize_url(url):
              """Normalize URL for deduplication."""
              parsed = urlparse(url)
              scheme = 'https'
              netloc = parsed.netloc.lower()
              if netloc.startswith('www.'):
                  netloc = netloc[4:]
              path = parsed.path.rstrip('/')
              return urlunparse((scheme, netloc, path, '', '', ''))

          def fetch_json(url, timeout=30):
              """Fetch JSON from URL."""
              resp = requests.get(url, timeout=timeout)
              resp.raise_for_status()
              return resp.json()

          def resolve_url(base_url, href):
              """Resolve relative href against base URL."""
              if href.startswith('http'):
                  return href
              from urllib.parse import urljoin
              return urljoin(base_url, href)

          # Portolan requires every bbox to be WGS84, 4 or 6 elements, free of
          # NaN/infinity and of "effectively infinite" sentinels such as
          # +/-1.79e308. Third-party catalogs violate this: one collection in
          # the IGN Argentina catalog carries -1.79e308 (an uninitialised
          # float) for west and south, which poisons the whole union and would
          # publish a world-spanning box. Drop error values outright and clamp
          # honest floating-point overshoot (e.g. latitude -90.00000001).
          BBOX_SENTINEL = 1e300

          def clean_bbox(bbox):
              """Return a valid WGS84 bbox, or None if it cannot be salvaged."""
              if not bbox or len(bbox) not in (4, 6):
                  return None
              if not all(isinstance(v, (int, float)) and not isinstance(v, bool)
                         for v in bbox):
                  return None
              if any(math.isnan(v) or math.isinf(v) or abs(v) > BBOX_SENTINEL
                     for v in bbox):
                  return None
              half = len(bbox) // 2
              mins, maxs = list(bbox[:half]), list(bbox[half:])
              for axis, limit in ((0, 180.0), (1, 90.0)):
                  mins[axis] = max(-limit, min(limit, mins[axis]))
                  maxs[axis] = max(-limit, min(limit, maxs[axis]))
              if mins[1] > maxs[1]:
                  return None
              return mins + maxs

          def union_bboxes(bboxes):
              """Union cleaned bboxes. Splits by length rather than hardcoding
              indices, because a 6-element bbox is ordered
              [west, south, min_alt, east, north, max_alt] -- indexing 0-3 would
              read min_alt as east. A mixed set degrades to 2D."""
              if not bboxes:
                  return None
              half = min(len(b) // 2 for b in bboxes)
              mins = [min(b[i] for b in bboxes) for i in range(half)]
              maxs = [max(b[len(b) // 2 + i] for b in bboxes) for i in range(half)]
              return mins + maxs

          def crawl_catalog(catalog_url):
              """Crawl a STAC catalog and extract metadata."""
              print(f"Crawling: {catalog_url}")
              catalog = fetch_json(catalog_url)

              result = {
                  'url': catalog_url,
                  'title': catalog.get('title'),
                  'description': catalog.get('description'),
                  'stac_version': catalog.get('stac_version'),
                  'providers': catalog.get('providers'),
                  'keywords': catalog.get('keywords'),
                  'bbox': None,
                  'license': None,
                  'collection_count': 0,
                  'feature_count': 0,
                  'item_count': 0,
                  'asset_count': 0,
                  'total_size_bytes': 0,
                  'temporal_extent': None,
                  'api_type': None,
                  'last_crawled': datetime.now(timezone.utc).isoformat(),
                  'validation': {
                      'stac_valid': True,
                      'has_versions_json': False,
                      'has_portolan_dir': False,
                      'has_llms_txt': False
                  }
              }

              # Detect API type (probe /search endpoint)
              base = catalog_url.rsplit('/', 1)[0]
              try:
                  resp = requests.get(f"{base}/search", timeout=5)
                  result['api_type'] = 'api' if resp.status_code == 200 else 'static'
              except:
                  result['api_type'] = 'static'

              # Check for llms.txt link at catalog level
              for link in catalog.get('links', []):
                  if link.get('rel') == 'llms':
                      result['validation']['has_llms_txt'] = True
                      break

              # Find child catalogs/collections
              bboxes = []
              licenses = set()
              temporal_extents = []

              for link in catalog.get('links', []):
                  if link.get('rel') != 'child':
                      continue

                  child_url = resolve_url(catalog_url, link['href'])
                  try:
                      child = fetch_json(child_url)

                      if child.get('type') == 'Collection':
                          result['collection_count'] += 1

                          # Extract bbox. Guard every level: a collection whose
                          # spatial extent is missing, empty or invalid must
                          # still be counted, so never let it raise here.
                          extent = child.get('extent') or {}
                          spatial = extent.get('spatial') or {}
                          raw_bboxes = spatial.get('bbox') or []
                          bbox = clean_bbox(raw_bboxes[0]) if raw_bboxes else None
                          if bbox:
                              bboxes.append(bbox)
                          elif raw_bboxes:
                              print(f"  Warning: discarding invalid bbox on {child_url}: {raw_bboxes[0]}")

                          # Extract temporal extent
                          temporal = extent.get('temporal', {}).get('interval', [[]])[0]
                          if temporal and len(temporal) >= 2:
                              temporal_extents.append(temporal)

                          # Extract license
                          if child.get('license'):
                              licenses.add(child['license'])

                          # Extract feature count
                          if child.get('table:row_count'):
                              result['feature_count'] += child['table:row_count']

                          # Count assets and sizes
                          for asset_key, asset in child.get('assets', {}).items():
                              result['asset_count'] += 1
                              if isinstance(asset, dict) and 'file:size' in asset:
                                  result['total_size_bytes'] += asset['file:size']

                          # Check for versions.json
                          for clink in child.get('links', []):
                              if clink.get('rel') == 'version-history':
                                  result['validation']['has_versions_json'] = True

                      elif child.get('type') == 'Catalog':
                          # Recurse into sub-catalogs
                          sub = crawl_catalog(child_url)
                          result['collection_count'] += sub['collection_count']
                          result['feature_count'] += sub['feature_count']
                          result['item_count'] += sub['item_count']
                          result['asset_count'] += sub['asset_count']
                          result['total_size_bytes'] += sub['total_size_bytes']
                          if sub['bbox']:
                              bboxes.append(sub['bbox'])
                          if sub['license']:
                              licenses.add(sub['license'])
                          if sub['temporal_extent']:
                              temporal_extents.append(sub['temporal_extent'])
                          if sub['validation']['has_versions_json']:
                              result['validation']['has_versions_json'] = True
                          if sub['validation']['has_llms_txt']:
                              result['validation']['has_llms_txt'] = True

                  except Exception as e:
                      print(f"  Warning: Failed to fetch {child_url}: {e}")

              # Aggregate bbox (union of all bboxes)
              result['bbox'] = union_bboxes(bboxes)

              # Aggregate temporal extent (union)
              if temporal_extents:
                  starts = [t[0] for t in temporal_extents if t[0]]
                  ends = [t[1] for t in temporal_extents if t[1]]
                  result['temporal_extent'] = [
                      min(starts) if starts else None,
                      max(ends) if ends else None
                  ]

              # Pick most common license (or first if tie)
              if licenses:
                  result['license'] = sorted(licenses)[0]

              # Check for .portolan directory
              try:
                  portolan_url = f"{base}/.portolan/config.yaml"
                  resp = requests.head(portolan_url, timeout=10)
                  result['validation']['has_portolan_dir'] = resp.status_code == 200
              except:
                  pass

              return result

          # Load existing state from export for re-submission detection
          export_file = Path('exports/catalogs.json')
          state = {}
          if export_file.exists():
              with open(export_file) as f:
                  existing = json.load(f)
              for link in existing.get('links', []):
                  if link.get('rel') != 'child' or not link.get('portolan:id'):
                      continue
                  state[link['portolan:id']] = {
                      'status': link.get('portolan:status', 'valid'),
                      'failure_reason': link.get('portolan:failure_reason')
                  }

          # Load all existing catalog URLs for duplicate detection
          existing_urls = {}
          for yaml_file in Path('catalogs').glob('*.yaml'):
              with open(yaml_file) as f:
                  entry = yaml.safe_load(f)
              if entry and entry.get('url'):
                  normalized = normalize_url(entry['url'])
                  existing_urls[normalized] = yaml_file.name

          # Read changed files
          changed_files = []
          with open('changed.txt') as f:
              changed_files = [line.strip() for line in f if line.strip()]

          # Process only changed catalog entries
          errors = []
          for file_path in changed_files:
              yaml_file = Path(file_path)
              if not yaml_file.exists():
                  continue

              print(f"\n=== Processing {yaml_file} ===")
              with open(yaml_file) as f:
                  entry = yaml.safe_load(f)

              url = entry.get('url')
              if not url:
                  errors.append(f"{yaml_file}: Missing 'url' field")
                  continue

              if not url.endswith('catalog.json'):
                  errors.append(f"{yaml_file}: URL must end with 'catalog.json'")
                  continue

              # Check catalog state
              catalog_id = yaml_file.stem
              catalog_state = state.get(catalog_id, {})
              if catalog_state.get('status') == 'removed':
                  print(f"  Note: Re-submitting previously removed catalog")
                  print(f"  (Was removed due to: {catalog_state.get('failure_reason', 'unknown')})")

              # Check for duplicates
              normalized = normalize_url(url)
              for existing_norm, existing_file in existing_urls.items():
                  if existing_norm == normalized and existing_file != yaml_file.name:
                      errors.append(
                          f"{yaml_file}: Duplicate catalog URL detected. "
                          f"This catalog already exists in '{existing_file}'"
                      )
                      break
              else:
                  # No duplicate found, proceed with validation
                  try:
                      result = crawl_catalog(url)
                      print(f"  Title: {result['title']}")
                      print(f"  Collections: {result['collection_count']}")
                      print(f"  Features: {result['feature_count']}")
                      print(f"  Assets: {result['asset_count']}")
                      print(f"  Size: {result['total_size_bytes']} bytes")
                      print(f"  Temporal: {result['temporal_extent']}")
                      print(f"  API Type: {result['api_type']}")
                      print(f"  BBox: {result['bbox']}")
                      print(f"  License: {result['license']}")
                      print(f"  Validation: {result['validation']}")

                      # Validate maintainer email if present
                      maintainer_email = extract_maintainer_email(result.get('providers'))
                      if maintainer_email:
                          try:
                              validated = validate_maintainer_email(maintainer_email, catalog_id)
                              print(f"  Maintainer email: {validated}")
                          except ValueError as e:
                              errors.append(f"{yaml_file}: {e}")
                  except requests.exceptions.RequestException as e:
                      errors.append(f"{yaml_file}: Failed to fetch catalog: {e}")
                  except Exception as e:
                      errors.append(f"{yaml_file}: Error processing catalog: {e}")

          if errors:
              print("\n=== ERRORS ===")
              for err in errors:
                  print(f"  - {err}")
              exit(1)

          print("\n=== All changed catalogs validated successfully ===")
          PYTHON
