name: Validate Catalogs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'catalogs/*.yaml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Get changed catalogs
        id: changed
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'catalogs/*.yaml' > changed.txt
          echo "Changed catalog files:"
          cat changed.txt
          echo "count=$(wc -l < changed.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Validate changed catalogs
        run: uv run --frozen scripts/validate_entries.py --changed-file changed.txt
