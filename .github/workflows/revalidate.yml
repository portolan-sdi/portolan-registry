name: Scheduled Re-validation

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revalidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Re-validate all catalogs
        id: revalidate
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: uv run --frozen scripts/revalidate_all.py

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add exports/catalogs.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update catalog validity states [skip ci]"
            git push
            echo "Pushed updated state and export"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh portolan-sdi.org catalog cache
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $REVALIDATE_SECRET" \
            https://www.portolan-sdi.org/api/revalidate
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
