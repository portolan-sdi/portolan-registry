name: Scheduled Re-validation

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:

permissions:
  contents: write

# Shared with Publish Catalog Export: both propose the export on the same
# branch, so they take turns rather than overwrite each other.
concurrency:
  group: catalog-export
  cancel-in-progress: false

jobs:
  revalidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # The export dates each catalog by the commit that added its entry
          # file. A shallow clone cannot see that commit.
          fetch-depth: 0
          # Keep GITHUB_TOKEN out of the git config. checkout stores it as an
          # Authorization header, which git sends ahead of the app token that
          # propose-export puts in the remote URL. The export push then runs as
          # github-actions[bot], and GitHub holds its pull request checks.
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      # The export publishes what rashid and stac-node-validator find as
      # portolan_registry:stac_valid. Without them it publishes null.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install stac-node-validator
        run: npm ci --prefix scripts/stac-node-validator --no-audit --no-fund

      - name: Re-validate all catalogs
        id: revalidate
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: uv run --frozen --group validators scripts/revalidate_all.py

      - name: Propose the export
        uses: ./.github/actions/propose-export
        with:
          client-id: ${{ secrets.REGISTRY_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.REGISTRY_BOT_APP_KEY }}
          commit-message: "chore: update catalog validity states"
