name: Refresh Site Cache

# The export now reaches main through a pull request, so the moment worth
# telling the site about is the merge, not the crawl. Both crawling workflows
# finish while their export is still a proposal.
on:
  push:
    branches:
      - main
    paths:
      - 'exports/catalogs.json'

      - 'exports/coverage-bboxes.json'
permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh portolan-sdi.org catalog cache
        continue-on-error: true
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $REVALIDATE_SECRET" \
            https://www.portolan-sdi.org/api/revalidate
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}

      - name: Create site token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: site-token
        with:
          client-id: ${{ secrets.REGISTRY_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.REGISTRY_BOT_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: portolan-sdi.org
          permission-contents: write

      - name: Request site coverage bake
        env:
          GH_TOKEN: ${{ steps.site-token.outputs.token }}
        run: |
          gh api \
            --method POST \
            repos/portolan-sdi/portolan-sdi.org/dispatches \
            --field event_type=registry-export-updated \
            --field "client_payload[registry_sha]=$GITHUB_SHA"
