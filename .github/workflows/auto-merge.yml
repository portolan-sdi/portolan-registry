name: Auto-merge after validation

# zizmor flags every workflow_run trigger. This one checks out nothing and
# runs no submitted code. It reads the pull request through the API only.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["Validate Catalogs"]
    types: [completed]

# Read only. The merge runs on the app token below, not on GITHUB_TOKEN.
permissions:
  contents: read
  pull-requests: read

jobs:
  auto-merge:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Decide whether the pull request merges itself
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id
            });
            // GitHub leaves `pull_requests` empty when the head branch is on
            // a fork. Then find the pull request from the head repository,
            // the head branch, and the head commit. GitHub sets these fields.
            // The fork controls the artifact that Validate Catalogs uploads,
            // so this lookup does not read it. A fork merges into the default
            // branch only.
            const findNumber = async () => {
              const prs = run.data.pull_requests;
              if (prs && prs.length > 0) {
                return prs[0].number;
              }
              const head = run.data.head_repository;
              if (!head) {
                console.log('The run names no head repository; nothing to merge');
                return null;
              }
              const open = await github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${head.owner.login}:${run.data.head_branch}`,
                base: context.payload.repository.default_branch
              });
              const matches = open.filter(
                p => p.head.repo
                  && p.head.repo.full_name === head.full_name
                  && p.head.sha === run.data.head_sha
              );
              if (matches.length !== 1) {
                console.log(`${matches.length} open pull requests match ${head.full_name}:${run.data.head_branch} at ${run.data.head_sha}; nothing to merge`);
                return null;
              }
              return matches[0].number;
            };
            const number = await findNumber();
            if (number === null) {
              core.setOutput('decision', 'none');
              return;
            }
            core.setOutput('number', String(number));
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number
            });
            // Dependency bots arm auto-merge on their own pull requests, and
            // the required checks gate the merge. This workflow decides only
            // catalog submissions, so it leaves those pull requests alone. A
            // hold here would turn their auto-merge off. GitHub reserves
            // [bot] logins, so a person cannot claim one.
            const dependencyBots = ['portolan-renovate[bot]', 'dependabot[bot]'];
            if (dependencyBots.includes(pr.user.login)) {
              console.log(`PR #${number} is a ${pr.user.login} update; its required checks decide`);
              core.setOutput('decision', 'none');
              return;
            }
            // A hold also clears any auto-merge that an earlier run turned
            // on. Otherwise a commit pushed after that run merges with it.
            const hold = reason => {
              console.log(`PR #${number} ${reason}; leaving it for a human`);
              core.setOutput('decision', 'hold');
              core.setOutput('auto_on', pr.auto_merge ? 'true' : 'false');
            };
            // The run checked one commit. Judge only that commit. A newer
            // commit starts its own run, and that run decides. So this run
            // changes nothing, and an old run cannot undo a newer decision.
            const checked = context.payload.workflow_run.head_sha;
            if (pr.head.sha !== checked) {
              console.log(`PR #${number} moved from ${checked} to ${pr.head.sha}; the newer run decides`);
              core.setOutput('decision', 'none');
              return;
            }
            core.setOutput('sha', checked);
            // Validate Catalogs now runs on every pull request, so passing it
            // no longer means "a catalog submission is sound". Only a change
            // confined to generated files merges itself. Anything touching
            // code waits for a human.
            //
            // The export earns its place here for the same reason an entry
            // does: a bot wrote it, and Validate Exports checks it against
            // the schema. Nobody is waiting to read it.
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number
            });
            // The API lists at most 3,000 files. A file past that limit is
            // a file this check cannot see.
            if (files.length !== pr.changed_files) {
              hold(`lists ${files.length} of ${pr.changed_files} files`);
              return;
            }
            // Only a new entry merges itself. An edit can point another
            // party's catalog at a new URL or address, and a deletion
            // leaves Validate Catalogs nothing to check. A catalog leaves
            // the registry through `status: removed` in the export, never
            // through a file deletion. A rename removes the old name, so
            // the check reads `previous_filename` too.
            const isEntry = name => /^catalogs\/[^/]+\.yaml$/.test(name || '');
            const isExport = name => name === 'exports/catalogs.json'
              || name === 'exports/coverage-bboxes.json';
            const heldEntries = files.filter(
              f => (isEntry(f.filename) || isEntry(f.previous_filename))
                && f.status !== 'added'
            );
            if (heldEntries.length > 0) {
              for (const f of heldEntries) {
                console.log(`PR #${number}: ${f.filename} is ${f.status}, not added`);
              }
              hold('changes a current entry');
              return;
            }
            const generatedOnly = files.length > 0 && files.every(
              f => (isEntry(f.filename) && f.status === 'added')
                || (isExport(f.filename)
                  && ['added', 'modified'].includes(f.status))
            );
            if (!generatedOnly) {
              hold('changes more than entries');
              return;
            }
            core.setOutput('decision', 'merge');

      # An app token, not GITHUB_TOKEN. GitHub attributes the merge to whoever
      # enabled auto-merge, and a push made as GITHUB_TOKEN starts no
      # workflow. Publish and Refresh Site Cache listen for that push.
      - name: Create merge token
        if: >
          steps.pr.outputs.decision == 'merge' ||
          steps.pr.outputs.auto_on == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        with:
          client-id: ${{ secrets.REGISTRY_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.REGISTRY_BOT_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Disable auto-merge on a held pull request
        if: >
          steps.pr.outputs.decision == 'hold' &&
          steps.pr.outputs.auto_on == 'true'
        run: |
          gh pr merge --disable-auto "$PR_NUMBER" \
            --repo "${{ github.repository }}"
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          GH_TOKEN: ${{ steps.token.outputs.token }}

      # --match-head-commit binds the merge to the commit this run checked.
      - name: Enable auto-merge
        if: steps.pr.outputs.decision == 'merge'
        run: |
          gh pr merge --auto --squash "$PR_NUMBER" \
            --match-head-commit "$HEAD_SHA" \
            --repo "${{ github.repository }}"
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
