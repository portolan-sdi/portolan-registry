name: Auto-merge after validation

on:
  workflow_run:
    workflows: ["Validate Catalogs"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Get PR number
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            // GitHub leaves `pull_requests` empty on a workflow run that a
            // fork pull request started. Most catalog submissions come from
            // forks, so find the pull request from the head repository and
            // branch instead. Require its head commit to match the run, so a
            // result for an old commit never acts on a newer one.
            async function findPr(run) {
              if (run.pull_requests && run.pull_requests.length > 0) {
                return run.pull_requests[0].number;
              }
              const owner = run.head_repository && run.head_repository.owner
                ? run.head_repository.owner.login : null;
              if (!owner || !run.head_branch) {
                return null;
              }
              const open = await github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${owner}:${run.head_branch}`
              });
              const pr = open.find(p => p.head.sha === run.head_sha);
              return pr ? pr.number : null;
            }
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id
            });
            const number = await findPr(run.data);
            if (number === null) {
              console.log('No PR found');
              return null;
            }
            // Validate Catalogs now runs on every pull request, so passing it
            // no longer means "a catalog submission is sound". Only a change
            // confined to generated files merges itself. Anything touching
            // code waits for a human.
            //
            // The export earns its place here for the same reason an entry
            // does: a bot wrote it, and Validate Exports checks it against
            // the schema. Nobody is waiting to read it.
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number
            });
            const generatedOnly = files.length > 0 && files.every(
              f => /^catalogs\/[^/]+\.yaml$/.test(f.filename)
                || f.filename === 'exports/catalogs.json'
                || f.filename === 'exports/coverage-bboxes.json'
            );
            if (!generatedOnly) {
              console.log(`PR #${number} changes more than entries; leaving it`);
              return null;
            }
            return number;
          result-encoding: string

      - name: Enable auto-merge
        if: steps.pr.outputs.result != 'null'
        run: |
          gh pr merge --auto --squash "$PR_NUMBER" \
            --match-head-commit "$HEAD_SHA" \
            --repo "${{ github.repository }}"
        env:
          PR_NUMBER: ${{ steps.pr.outputs.result }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trigger-publish:
    permissions:
      actions: write
      pull-requests: read
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for merge and trigger publish
        uses: actions/github-script@v9
        with:
          script: |
            // GitHub leaves `pull_requests` empty on a workflow run that a
            // fork pull request started. Most catalog submissions come from
            // forks, so find the pull request from the head repository and
            // branch instead. Require its head commit to match the run, so a
            // result for an old commit never acts on a newer one.
            async function findPr(run) {
              if (run.pull_requests && run.pull_requests.length > 0) {
                return run.pull_requests[0].number;
              }
              const owner = run.head_repository && run.head_repository.owner
                ? run.head_repository.owner.login : null;
              if (!owner || !run.head_branch) {
                return null;
              }
              const open = await github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${owner}:${run.head_branch}`
              });
              const pr = open.find(p => p.head.sha === run.head_sha);
              return pr ? pr.number : null;
            }
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id
            });
            const prNumber = await findPr(run.data);
            if (prNumber === null) {
              console.log('No PR found');
              return;
            }

            // Same reason as the auto-merge job: a passing gate no longer
            // implies a catalog submission. Publishing is what a new entry
            // needs, and a code merge does not need it here.
            //
            // Entries only, deliberately narrower than the auto-merge job
            // above. Publishing produces an export pull request, so counting
            // an export merge as a reason to publish would crawl forever.
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            const entriesOnly = files.length > 0 && files.every(
              f => /^catalogs\/[^/]+\.yaml$/.test(f.filename)
            );
            if (!entriesOnly) {
              console.log(`PR #${prNumber} changes more than entries; no publish`);
              return;
            }

            // Poll until PR is merged (max 5 minutes)
            for (let i = 0; i < 30; i++) {
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });

              if (pr.data.merged) {
                console.log(`PR #${prNumber} merged, triggering publish`);
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'publish.yml',
                  ref: 'main'
                });
                return;
              }

              if (pr.data.state === 'closed') {
                console.log(`PR #${prNumber} closed without merge`);
                return;
              }

              console.log(`Waiting for PR #${prNumber} to merge... (${i + 1}/30)`);
              await new Promise(r => setTimeout(r, 10000));
            }

            console.log('Timeout waiting for merge');
