name: Auto-merge after validation

on:
  workflow_run:
    workflows: ["Validate Catalogs"]
    types: [completed]

# Read only. The merge runs on the app token below, not on GITHUB_TOKEN.
permissions:
  contents: read
  pull-requests: read

jobs:
  auto-merge:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Get PR number
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id
            });
            const prs = run.data.pull_requests;
            if (!prs || prs.length === 0) {
              return null;
            }
            const number = prs[0].number;
            // Validate Catalogs now runs on every pull request, so passing it
            // no longer means "a catalog submission is sound". Only a change
            // confined to generated files merges itself. Anything touching
            // code waits for a human.
            //
            // The export earns its place here for the same reason an entry
            // does: a bot wrote it, and Validate Exports checks it against
            // the schema. Nobody is waiting to read it.
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number
            });
            const generatedOnly = files.length > 0 && files.every(
              f => /^catalogs\/[^/]+\.yaml$/.test(f.filename)
                || f.filename === 'exports/catalogs.json'
                || f.filename === 'exports/coverage-bboxes.json'
            );
            if (!generatedOnly) {
              console.log(`PR #${number} changes more than entries; leaving it`);
              return null;
            }
            return number;
          result-encoding: string

      # An app token, not GITHUB_TOKEN. GitHub attributes the merge to whoever
      # enabled auto-merge, and a push made as GITHUB_TOKEN starts no
      # workflow. Publish and Refresh Site Cache listen for that push.
      - name: Create merge token
        if: steps.pr.outputs.result != 'null'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        with:
          client-id: ${{ secrets.REGISTRY_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.REGISTRY_BOT_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Enable auto-merge
        if: steps.pr.outputs.result != 'null'
        run: |
          gh pr merge --auto --squash "$PR_NUMBER" \
            --repo "${{ github.repository }}"
        env:
          PR_NUMBER: ${{ steps.pr.outputs.result }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
