name: Publish Catalog Export

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - 'catalogs/*.yaml'

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Crawl catalogs and generate export
        run: uv run --frozen scripts/publish_export.py

      - name: Commit and push export
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add exports/catalogs.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update catalogs.json export [skip ci]"

            # Retry loop to handle concurrent pushes
            for attempt in 1 2 3; do
              if git push; then
                echo "Pushed updated catalogs.json"
                echo "changed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Push failed (attempt $attempt), rebasing..."
              git fetch origin main
              git rebase origin/main
            done

            echo "Failed to push after 3 attempts"
            exit 1
          fi

      - name: Refresh portolan-sdi.org catalog cache
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $REVALIDATE_SECRET" \
            https://www.portolan-sdi.org/api/revalidate
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
