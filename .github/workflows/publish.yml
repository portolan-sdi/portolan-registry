name: Publish Catalog Export

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - 'catalogs/*.yaml'

permissions:
  contents: write

# One crawl at a time. Both this and Scheduled Re-validation propose the
# export on the same branch, and a second run force-pushing mid-flight would
# leave the open pull request describing a crawl nobody kept.
concurrency:
  group: catalog-export
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The run crawls and mirrors every catalog with 4 workers. It took
    # about 10 minutes before the mirror in October 2026.
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # The export dates each catalog by the commit that added its entry
          # file. A shallow clone cannot see that commit.
          fetch-depth: 0
          # Keep GITHUB_TOKEN out of the git config. checkout stores it as an
          # Authorization header, which git sends ahead of the app token that
          # propose-export puts in the remote URL. The export push then runs as
          # github-actions[bot], and GitHub holds its pull request checks.
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # The export publishes what rashid and stac-node-validator find as
      # portolan_registry:stac_valid. Without them it publishes null.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install stac-node-validator
        run: npm ci --prefix scripts/stac-node-validator --no-audit --no-fund

      - name: Crawl catalogs and generate export
        run: uv run --frozen --group validators scripts/publish_export.py

      - name: Propose the export
        uses: ./.github/actions/propose-export
        with:
          client-id: ${{ secrets.REGISTRY_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.REGISTRY_BOT_APP_KEY }}
          commit-message: "chore: update the catalog export"
