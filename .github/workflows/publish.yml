name: Publish Catalog Export

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - 'catalogs/*.yaml'

permissions:
  contents: write

# One crawl at a time. Both this and Scheduled Re-validation propose the
# export on the same branch, and a second run force-pushing mid-flight would
# leave the open pull request describing a crawl nobody kept.
concurrency:
  group: catalog-export
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # The export dates each catalog by the commit that added its entry
          # file. A shallow clone cannot see that commit.
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Crawl catalogs and generate export
        run: uv run --frozen scripts/publish_export.py

      - name: Propose the export
        uses: ./.github/actions/propose-export
        with:
          client-id: ${{ secrets.REGISTRY_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.REGISTRY_BOT_APP_KEY }}
          commit-message: "chore: update the catalog export"
