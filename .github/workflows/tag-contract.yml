name: Tag Contract Release

# A contract release is a pull request that adds schemas/vX.Y.Z/
# (scripts/release_contract.py). When it merges, tag the commit that added
# the release as export-vX.Y.Z, so each release names the code that wrote it.
on:
  push:
    branches:
      - main
    paths:
      - 'schemas/**'

permissions:
  contents: read

jobs:
  tag:
    name: Tag Contract Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - name: Tag each release that has no tag
        run: |
          for dir in schemas/v*/; do
            [ -d "$dir" ] || continue
            tag="export-$(basename "$dir")"
            if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
              continue
            fi
            # The commit that added the release, not this push. A run that
            # failed before must not tag an old release at a later commit.
            commit=$(git log --diff-filter=A --format=%H -- "$dir" | tail -n 1)
            git tag "$tag" "$commit"
            git push origin "refs/tags/$tag"
            echo "Tagged $commit as $tag"
          done
