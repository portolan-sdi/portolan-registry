name: Catalog removal request
description: Ask to take a registered catalog out of the registry
# The catalog-removal label starts the mail to the submitter, in
# .github/workflows/notify-feedback.yml.
labels: [catalog-removal]
body:
  - type: markdown
    attributes:
      value: >-
        Use this form to ask the registry to remove a catalog. Anyone can ask.
        The registry emails your request to the person who registered the
        catalog. A maintainer reviews every request. If you did not register
        the catalog, the maintainer waits 14 days for that person to reply
        before the removal. Spam and legal requests do not wait. Your request
        and your GitHub name are public. After the removal, no other catalog
        can use the id.
  # notify_feedback.py reads the answers under these headings. Keep the
  # labels "Catalog ID", "Relationship", and "Why".
  - type: input
    id: catalog-id
    attributes:
      label: Catalog ID
      description: >-
        The registry id, which is the stem of `catalogs/{id}.yaml` and the
        `portolan_registry:id` of the catalog's link in
        [the export](https://raw.githubusercontent.com/portolan-sdi/portolan-registry/refs/heads/main/exports/catalogs.json).
      placeholder: geoconnex-geoparquet
    validations:
      required: true
  - type: dropdown
    id: relationship
    attributes:
      label: Relationship
      description: How you relate to the catalog. The maintainer can ask you to confirm it.
      options:
        - I registered this catalog
        - I work for the publisher, and someone else registered it
        - I maintain this registry
        - Other
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: >-
        Why the catalog should leave the registry. Example: the official
        publisher now registers its own catalog.
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Contact address
      description: >-
        Optional. An address where the maintainer can reach you. It is
        public on this issue. Your GitHub account is enough if you leave this
        blank.
    validations:
      required: false
  - type: dropdown
    id: url-online
    attributes:
      label: Does the catalog stay online?
      description: Optional. Whether the catalog's URL still answers after the removal.
      options:
        - "Yes"
        - "No"
        - I do not know
    validations:
      required: false
