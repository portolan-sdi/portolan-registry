[project]
name = "portolan-registry-scripts"
version = "0"
description = "Crawler and export tooling for the Portolan registry."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "requests>=2.32",
    "email-validator>=2.2",
    "urllib3>=2.8",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "deptry>=0.25.1",
    "diff-cover>=10.6.0",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "responses>=0.25",
    "types-jsonschema>=4.26",
    "types-pyyaml>=6.0.12.20260906",
    "types-requests>=2.33.0.20261006",
    "types-shapely>=2.1",
    "vulture>=2.16",
    "xenon>=0.9.3",
]
# The Portolan validator the pull request gate and the nightly run over each
# catalog's metadata (scripts/registry/validators.py). Pinned exactly: a new
# release can add rules, and a rule change must arrive as its own pull request
# rather than turn existing entries red overnight. Kept out of `dev` because it
# pulls in rasterio and pyarrow. Install with `--group validators`.
validators = [
    "rashid==0.3.0",
]
# What scripts/build_site.py needs to build and check the Pages site: the
# GeoParquet writer and the JSON Schema check of each published file. Install
# with `--group site`.
site = [
    # The extra adds the checkers for `date-time` and `uri`.
    "jsonschema[format-nongpl]>=4.26",
    "pyarrow>=26",
    "shapely>=2.2",
]

# Dependencies only. There is nothing to build or install, so uv skips the
# build backend entirely and just resolves the environment.
[tool.uv]
package = false

[tool.pytest.ini_options]
# `scripts` rather than `scripts/tests`, so tests import the package as
# `registry.crawl`. Without this pytest prepends the test directory instead
# and the import fails.
pythonpath = ["scripts"]
testpaths = ["scripts/tests"]
markers = [
    "network: hits the real network; deselected by default",
]
addopts = "-m 'not network' -q"

[tool.ruff]
line-length = 100
target-version = "py311"
# A copy of the portolan-ops template. Keep it byte-identical to ops.
extend-exclude = ["scripts/pip_audit_ignores.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["registry"]

[tool.mypy]
strict = true
python_version = "3.11"
# mypy checks the code under scripts/ and skips the tests.
files = ["scripts"]
exclude = ["^scripts/tests/"]

# pyarrow ships no type information and has no stub package.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.vulture]
paths = ["scripts"]
min_confidence = 80

[tool.bandit]
exclude_dirs = ["scripts/tests", ".venv"]

[tool.deptry]
known_first_party = ["registry"]
exclude = [".venv", "scripts/tests", ".claude"]
# deptry reads every dependency group as a dev group. The `site` group is the
# runtime of scripts/build_site.py, which the Pages workflow runs.
per_rule_ignores = { DEP004 = ["jsonschema", "pyarrow", "shapely"] }

[tool.coverage.run]
source = ["scripts"]
# pip_audit_ignores.py is a copy of the portolan-ops template, and ops tests it.
omit = ["scripts/tests/*", "scripts/pip_audit_ignores.py"]

[tool.codespell]
# TGE Labs hosts st-louis-open-data-mirror. The test suite names it.
ignore-words-list = "tge"
